<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Обеспечивает корректное масштабирование на мобильных устройствах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Помогает избежать уязвимостей вроде XSS и контролирует загрузку ресурсов -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <!-- Название вкладки в браузере -->
    <title>Название сайта</title>
    <!-- Краткое описание страницы для поисковых систем -->
    <meta name="description" content="Краткое описание вашего сайта">
    <!-- Подключение внешнего файла стилей (пока файл может быть пустым) -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Шапка сайта: логотип, основное меню -->
    <header>
        <nav>
            <a href="sweet.html">рецепты сладостей</a>
        </nav>
    </header>

    <!-- Основное содержимое страницы -->
    <main>
        <section>
            <h1>Заголовок первого уровня</h1>
            <p>Основной контент страницы.</p>
        </section>
    </main>

    <!-- Боковая панель (необязательный блок) -->
    <aside>
        <h2>Дополнительная информация</h2>
        <p>Сюда можно добавить виджеты, рекламу или ссылки на свежие статьи.</p>
    </aside>

    <!-- Подвал сайта: копирайт, дублирующее меню -->
    <footer>
        <p>&copy; 2026 Название компании. Все права защищены.</p>
    </footer>

    <!-- Подключение скриптов перед закрывающим тегом body для ускорения загрузки страницы -->
    <script src="script.js"></script>
</body>
</html>
